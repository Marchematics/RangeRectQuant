<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="18cm" height="6.72cm" viewBox="0 0 1500 560">
<title>RangeRectQuant method overview</title>
<desc>Only the construction phase changes the source X to a quantized field Y. Backward remaining-row feasibility precedes forward coarse-first selection, repeated for each row. Protected choices stay exact and can retain nonzero remainders. The two quotient/remainder coding paths are lossless with respect to Y, not X. Decoding recombines Y directly and does not invert the lossy construction. Sum and valid-count prefix tables use decoded Y and the exact missing mask. The figure does not depict the finite-rank coding bound as the implemented LZMA format.</desc>
