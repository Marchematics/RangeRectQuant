<pattern id="downwardDiagonal" patternUnits="userSpaceOnUse" width="9" height="9"><rect width="9" height="9" fill="white"/><path d="M-2 7L2 11 M0 0L9 9 M7-2L11 2" stroke="#BBBBBB" stroke-width="1.1"/></pattern>
